name: Release IPA

# Builds an unsigned Garim.ipa and attaches it to a GitHub release.
# It never runs on ordinary pushes, so pushing code uses no Actions minutes.
# - Publishing a release on GitHub builds and attaches the IPA automatically.
# - Actions > Release IPA > Run workflow builds a tag (creating the release if it doesn't exist).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "IPA를 올릴 릴리즈 태그 (예: v1.1.0). 릴리즈가 없으면 선택한 브랜치로 새로 만들어요."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-ipa-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  ipa:
    # Skip, without taking a runner, when the release already carries the IPA
    # (scripts/publish-ipa.sh uploads it before publishing).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.release.assets.*.name, format('Garim-{0}-unsigned.ipa', github.event.release.tag_name))
    # Xcode 27 builds against the iOS 27 SDK, which iPhone Duo's full display needs.
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Pick commit
        id: pick
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            # An existing tag (always the case for a published release) is built from its own commit.
            echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          else
            # A new tag is created (or a draft release pinned) below at exactly the commit being built.
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pick.outputs.ref }}

      - name: Build unsigned IPA
        run: ./scripts/build-ipa.sh "build/Garim-${TAG}-unsigned.ipa"

      - name: Attach to release
        env:
          BUILT_REF: ${{ steps.pick.outputs.ref }}
        run: |
          IPA="build/Garim-${TAG}-unsigned.ipa"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$BUILT_REF" = "$GITHUB_SHA" ]; then
              # A draft release whose tag isn't created yet: pin the tag to the commit that was built.
              gh release edit "$TAG" --target "$GITHUB_SHA"
            fi
            gh release upload "$TAG" "$IPA" --clobber
          else
            gh release create "$TAG" "$IPA" --target "$GITHUB_SHA" --title "가림 $TAG" --generate-notes
          fi
